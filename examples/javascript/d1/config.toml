[node]
node_id = "00000000-0000-0000-0000-000000000105"
advertise_addr = "127.0.0.1:7105"
listen = "127.0.0.1:7105"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[[services]]
name = "d1"
worker_bundle_path = "examples/javascript/d1/worker.js"
compatibility_date = "2026-01-01"

[services.bindings.DB]
type = "d1_database"
database_name = "app"
unique_key = "app"

[[sockets]]
name = "public"
listen = "127.0.0.1:8105"
service = "d1"
