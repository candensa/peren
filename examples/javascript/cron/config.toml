[node]
node_id = "00000000-0000-0000-0000-000000000108"
advertise_addr = "127.0.0.1:7108"
listen = "127.0.0.1:7108"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[[services]]
name = "cron"
worker_bundle_path = "examples/javascript/cron/worker.js"
compatibility_date = "2026-01-01"
cron_triggers = [{ expression = "0 */5 * * * * *" }]

[[sockets]]
name = "public"
listen = "127.0.0.1:8108"
service = "cron"
