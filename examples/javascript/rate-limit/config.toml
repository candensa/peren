[node]
node_id = "00000000-0000-0000-0000-000000000126"
advertise_addr = "127.0.0.1:7126"
listen = "127.0.0.1:7126"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[[services]]
name = "rate-limit"
worker_bundle_path = "examples/javascript/rate-limit/worker.js"
compatibility_date = "2026-01-01"

[services.bindings.LIMIT]
type = "rate_limiter"
limit = 2
period_secs = 60

[[sockets]]
name = "public"
listen = "127.0.0.1:8126"
service = "rate-limit"
