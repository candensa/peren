[node]
node_id = "00000000-0000-0000-0000-000000000110"
advertise_addr = "127.0.0.1:7110"
listen = "127.0.0.1:7110"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[containers]
max_instances_per_node = 4

[[services]]
name = "container"
worker_bundle_path = "examples/javascript/container/worker.js"
compatibility_date = "2026-01-01"

[services.bindings.APP]
type = "container"
image = "ghcr.io/candensa/peren-demo:latest"
default_port = 8080
memory_mb = 256
cpu_millis = 250
allow_network_egress = false

[[sockets]]
name = "public"
listen = "127.0.0.1:8110"
service = "container"
