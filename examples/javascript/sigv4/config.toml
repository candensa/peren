[node]
node_id = "00000000-0000-0000-0000-000000000122"
advertise_addr = "127.0.0.1:7122"
listen = "127.0.0.1:7122"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[[services]]
name = "sigv4"
worker_bundle_path = "examples/javascript/sigv4/worker.js"
compatibility_date = "2026-01-01"

[services.bindings.AWS_BEDROCK]
type = "aws_sigv4"
credential_source = "environment"
region = "us-east-1"
service = "bedrock"
allowed_hosts = ["bedrock-runtime.us-east-1.amazonaws.com"]
access_key_env = "AWS_ACCESS_KEY_ID"
secret_key_env = "AWS_SECRET_ACCESS_KEY"

[[sockets]]
name = "public"
listen = "127.0.0.1:8122"
service = "sigv4"
