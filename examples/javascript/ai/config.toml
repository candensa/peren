[node]
node_id = "00000000-0000-0000-0000-000000000114"
advertise_addr = "127.0.0.1:7114"
listen = "127.0.0.1:7114"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[[services]]
name = "ai"
worker_bundle_path = "examples/javascript/ai/worker.js"
compatibility_date = "2026-01-01"

[services.bindings.AI]
type = "ai"
endpoint = "https://api.openai.com/v1"
credential_scope = "openai"

[services.bindings.AI.provider]
kind = "open_ai"
api_key_env = "OPENAI_API_KEY"

[[sockets]]
name = "public"
listen = "127.0.0.1:8114"
service = "ai"
