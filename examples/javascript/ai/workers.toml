[node]
node_id = "00000000-0000-0000-0000-000000000117"
advertise_addr = "127.0.0.1:7117"
listen = "127.0.0.1:7117"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[[services]]
name = "ai"
worker_bundle_path = "examples/javascript/ai/worker.js"
compatibility_date = "2026-01-01"

[services.bindings.AI]
type = "ai"
endpoint = "https://api.cloudflare.com/client/v4/accounts/redacted/ai/run"
credential_scope = "workers-ai"

[services.bindings.AI.provider]
kind = "workers_ai"
account_id_env = "CLOUDFLARE_ACCOUNT_ID"
api_token_env = "CLOUDFLARE_API_TOKEN"

[[sockets]]
name = "public"
listen = "127.0.0.1:8117"
service = "ai"
