[node]
node_id = "00000000-0000-0000-0000-000000000118"
advertise_addr = "127.0.0.1:7118"
listen = "127.0.0.1:7118"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[[services]]
name = "ai"
worker_bundle_path = "examples/javascript/ai/worker.js"
compatibility_date = "2026-01-01"

[services.bindings.AI]
type = "ai"
endpoint = "local"
credential_scope = "local"

[services.bindings.AI.provider]
kind = "local"
command = "examples/javascript/ai/local.sh"

[[sockets]]
name = "public"
listen = "127.0.0.1:8118"
service = "ai"
