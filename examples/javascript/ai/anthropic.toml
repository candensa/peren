[node]
node_id = "00000000-0000-0000-0000-000000000115"
advertise_addr = "127.0.0.1:7115"
listen = "127.0.0.1:7115"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[[services]]
name = "ai"
worker_bundle_path = "examples/javascript/ai/worker.js"
compatibility_date = "2026-01-01"

[services.bindings.AI]
type = "ai"
endpoint = "https://api.anthropic.com/v1"
credential_scope = "anthropic"

[services.bindings.AI.provider]
kind = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"

[[sockets]]
name = "public"
listen = "127.0.0.1:8115"
service = "ai"
