[node]
node_id = "00000000-0000-0000-0000-000000000115"
advertise_addr = "127.0.0.1:7115"
listen = "127.0.0.1:7115"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[[services]]
name = "vector"
worker_bundle_path = "examples/javascript/vector/worker.js"
compatibility_date = "2026-01-01"

[services.bindings.VECTORS]
type = "vectorize"
endpoint = "articles"
credential_scope = "vectors"

[services.bindings.VECTORS.provider]
kind = "local"

[[sockets]]
name = "public"
listen = "127.0.0.1:8115"
service = "vector"
