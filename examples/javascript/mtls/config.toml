[node]
node_id = "00000000-0000-0000-0000-000000000121"
advertise_addr = "127.0.0.1:7121"
listen = "127.0.0.1:7121"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[[services]]
name = "mtls"
worker_bundle_path = "examples/javascript/mtls/worker.js"
compatibility_date = "2026-01-01"

[services.bindings.PUBLIC_API]
type = "outbound"
allowed_hosts = ["example.com"]

[services.bindings.CLIENT_CERT]
type = "mtls_certificate"
cert_pem_env = "CLIENT_CERT_PEM"
key_pem_env = "CLIENT_KEY_PEM"

[[sockets]]
name = "public"
listen = "127.0.0.1:8121"
service = "mtls"
