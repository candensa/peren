[node]
node_id = "00000000-0000-0000-0000-000000000106"
advertise_addr = "127.0.0.1:7106"
listen = "127.0.0.1:7106"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[[services]]
name = "r2"
worker_bundle_path = "examples/javascript/r2/worker.js"
compatibility_date = "2026-01-01"

[services.bindings.BUCKET]
type = "r2_bucket"
endpoint = "memory://demo"
bucket = "demo"
credential_scope = "demo"

[[sockets]]
name = "public"
listen = "127.0.0.1:8106"
service = "r2"
