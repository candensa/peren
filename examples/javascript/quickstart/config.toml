[node]
node_id = "00000000-0000-0000-0000-000000000102"
advertise_addr = "127.0.0.1:7102"
listen = "127.0.0.1:7102"

[bucket]
kind = "memory"

[mtls]
ca_cert_path = "certs/ca.pem"
leaf_cert_path = "certs/leaf-cert.pem"
leaf_key_path = "certs/leaf-key.pem"

[console]
listen = "127.0.0.1:9102"
data_dir = "data/console"
backend = "sqlite"

[[services]]
name = "quickstart"
worker_bundle_path = "examples/javascript/quickstart/worker.js"
compatibility_date = "2026-01-01"

[services.vars]
MESSAGE = "ready"

[[sockets]]
name = "public"
listen = "127.0.0.1:8102"
service = "quickstart"
