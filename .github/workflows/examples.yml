name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: Rust dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  format:
    name: Rust format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  clippy:
    name: Rust clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: cargo test --workspace --all-features

  build:
    name: Release binary build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: cargo build --release --locked -p peren
      - uses: actions/upload-artifact@v7
        with:
          name: peren-release-binary
          path: target/release/peren

  examples:
    name: Example validation
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fetch --locked
      - uses: actions/download-artifact@v8
        with:
          name: peren-release-binary
          path: target/release
      - run: chmod +x target/release/peren
      - run: bash packaging/check-examples.sh
