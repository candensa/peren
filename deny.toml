  { id = "RUSTSEC-2026-0118", reason = "Transitive through Deno DNS dependencies; update when Deno releases compatible hickory constraints." },
  { id = "RUSTSEC-2026-0119", reason = "Transitive through Deno DNS dependencies; update when Deno releases compatible hickory constraints." },
  { id = "RUSTSEC-2026-0194", reason = "Transitive through object_store; update when object_store releases compatible quick-xml constraints." },
  { id = "RUSTSEC-2026-0195", reason = "Transitive through object_store; update when object_store releases compatible quick-xml constraints." },
  { id = "RUSTSEC-2026-0285", reason = "Transitive through Deno and queue TLS dependencies; update when upstream crates release compatible rustls constraints." },
